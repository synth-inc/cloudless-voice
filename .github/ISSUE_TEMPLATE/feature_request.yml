name: Feature request
description: Suggest an idea for Cloudless Voice
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, e.g. "When I dictate code identifiers in my editor, ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      description: Cloudless Voice transcribes on-device. Audio and transcript text only leave the Mac when the user explicitly chooses to send them.
      options:
        - label: This feature would need to send data off the Mac
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself (see CONTRIBUTING.md)
